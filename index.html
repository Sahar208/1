<!doctype html>
<html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>אי המילים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: a picture-book island map for kids (chunky toy buttons, big emoji cards); a calm data desk for the teacher behind a PIN. */
:root{
  --paper:#E8F5F1; --paper-2:#D3ECE6; --card:#FFFFFF; --ink:#163A44; --ink-soft:#4C6C75; --line:#C2DDD6;
  --sea:#127A8C; --sea-deep:#0B5866; --on-sea:#FFFFFF;
  --sun:#FFC23D; --sun-deep:#D99A12; --on-sun:#3A2900;
  --coral:#F0604C; --leaf:#2C9C61; --grape:#7657C4;
  --good:#23925A; --good-bg:#DDF3E6; --warn:#B87407; --warn-bg:#FCEFD2; --bad:#C93D30; --bad-bg:#FBE1DD;
  --shadow:rgba(22,58,68,.16); --dot:rgba(18,122,140,.10);
  --display:'Fredoka','Rubik',system-ui,sans-serif;
  --body:'Rubik','Fredoka',system-ui,sans-serif;
  --r-lg:22px; --r-md:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E2227; --paper-2:#153037; --card:#1A3940; --ink:#E5F3F0; --ink-soft:#9EBFC5; --line:#2B4E56;
  --sea:#3EB4C7; --sea-deep:#2A8E9E; --on-sea:#05252B;
  --sun:#FFC94F; --sun-deep:#C9930F; --on-sun:#2E2100;
  --coral:#FF7967; --leaf:#4CC385; --grape:#A68BF0;
  --good:#5AD496; --good-bg:#173D2C; --warn:#F2B64B; --warn-bg:#3D3115; --bad:#FF8577; --bad-bg:#45231F;
  --shadow:rgba(0,0,0,.4); --dot:rgba(62,180,199,.09); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E2227; --paper-2:#153037; --card:#1A3940; --ink:#E5F3F0; --ink-soft:#9EBFC5; --line:#2B4E56;
  --sea:#3EB4C7; --sea-deep:#2A8E9E; --on-sea:#05252B;
  --sun:#FFC94F; --sun-deep:#C9930F; --on-sun:#2E2100;
  --coral:#FF7967; --leaf:#4CC385; --grape:#A68BF0;
  --good:#5AD496; --good-bg:#173D2C; --warn:#F2B64B; --warn-bg:#3D3115; --bad:#FF8577; --bad-bg:#45231F;
  --shadow:rgba(0,0,0,.4); --dot:rgba(62,180,199,.09); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);background-image:radial-gradient(var(--dot) 1.6px,transparent 1.7px);background-size:22px 22px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
#app{max-width:1080px;margin-inline:auto}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--sea);outline-offset:3px;border-radius:10px}
.en{font-family:var(--display);direction:ltr;unicode-bidi:isolate}
.muted{color:var(--ink-soft)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.stack{display:grid;gap:18px}

/* toy buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font-family:var(--display);font-weight:600;font-size:1.05rem;
  background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);transition:transform .08s, box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--sea);color:var(--on-sea);box-shadow:0 5px 0 var(--sea-deep)}
.btn.primary:active:not(:disabled){box-shadow:0 2px 0 var(--sea-deep)}
.btn.sun{background:var(--sun);color:var(--on-sun);box-shadow:0 5px 0 var(--sun-deep)}
.btn.big{font-size:1.25rem;padding:16px 30px}
.btn.small{padding:7px 14px;font-size:.92rem;box-shadow:0 3px 0 var(--line)}
.btn.ghost{background:transparent;box-shadow:none;border:2px solid var(--line)}
.btn:disabled{opacity:.45}
.btn.pulse:not(:disabled){animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}

/* kid top bar */
.kbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.me{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:6px 16px 6px 8px;box-shadow:0 3px 0 var(--line)}
.me .av{font-size:1.8rem;line-height:1}
.me b{font-family:var(--display);font-size:1.1rem}
.starcount{font-family:var(--display);font-weight:600;background:var(--sun);color:var(--on-sun);border-radius:999px;padding:6px 14px;box-shadow:0 3px 0 var(--sun-deep);font-variant-numeric:tabular-nums}

/* WHO */
.hero{display:grid;gap:8px;text-align:center;margin-block:10px 26px}
.hero .logo{font-size:3.4rem;line-height:1}
.hero h1{font-size:clamp(2rem,5vw,3rem);color:var(--sea)}
.hero .sub{font-family:var(--display);font-size:1.15rem;color:var(--ink-soft)}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px}
.player{display:grid;justify-items:center;gap:4px;background:var(--card);border:0;border-radius:var(--r-lg);padding:18px 10px 14px;box-shadow:0 5px 0 var(--line);transition:transform .12s}
.player:hover{transform:translateY(-3px)}
.player .av{font-size:3rem;line-height:1.1}
.player b{font-family:var(--display);font-size:1.15rem;max-width:100%;overflow-wrap:anywhere}
.player small{color:var(--ink-soft);font-variant-numeric:tabular-nums}
.player.add{background:transparent;border:3px dashed var(--line);box-shadow:none;color:var(--sea)}
.teacher-link{display:flex;justify-content:center;margin-top:34px}

/* NEW PLAYER */
.panel{background:var(--card);border-radius:var(--r-lg);padding:24px;box-shadow:0 6px 0 var(--line)}
.field{display:grid;gap:6px}
.field label{font-weight:500}
input[type=text],input[type=password],input[type=tel]{font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
input:focus{outline:none;border-color:var(--sea)}
.avatars{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.avatars button{font-size:2rem;border:3px solid transparent;background:var(--paper);border-radius:var(--r-md);padding:6px 0}
.avatars button[aria-pressed="true"]{border-color:var(--sea);background:var(--paper-2)}

/* MAP */
.maptitle{display:grid;gap:4px;margin-bottom:18px}
.maptitle h1{font-size:clamp(1.7rem,4vw,2.3rem)}
.islands{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;position:relative;padding-block:12px}
.islands::before{content:"";position:absolute;inset-inline:10%;top:78px;border-top:5px dashed var(--line);z-index:0}
.island{position:relative;z-index:1;display:grid;justify-items:center;gap:6px;border:0;background:transparent;padding:0;text-align:center}
.island .blob{width:clamp(96px,14vw,132px);aspect-ratio:1;max-width:100%;border-radius:46% 54% 52% 48%/55% 45% 55% 45%;display:grid;place-items:center;font-size:clamp(2.6rem,5vw,3.4rem);
  background:var(--card);box-shadow:0 7px 0 var(--line);border:5px solid var(--stage);transition:transform .15s}
.island:hover:not(:disabled) .blob{transform:translateY(-4px) rotate(-3deg)}
.island .num{font-family:var(--display);font-weight:600;color:var(--stage);font-size:.95rem;letter-spacing:.04em}
.island .nm{font-family:var(--display);font-weight:600;font-size:1.05rem;line-height:1.2}
.island .stars{font-size:1.1rem;letter-spacing:2px}
.island.locked .blob{filter:grayscale(1);opacity:.5;border-style:dashed}
.island.current .blob{animation:bob 2.2s ease-in-out infinite;box-shadow:0 7px 0 var(--line),0 0 0 8px color-mix(in srgb,var(--stage) 25%,transparent)}
.island .here{font-family:var(--display);font-size:.85rem;background:var(--stage);color:var(--card);padding:2px 10px;border-radius:999px}
@keyframes bob{50%{transform:translateY(-6px)}}
.mapfoot{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:28px}
.cert-banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--sun);color:var(--on-sun);border-radius:var(--r-lg);padding:14px 18px;margin-bottom:18px;box-shadow:0 5px 0 var(--sun-deep)}
.cert-banner b{font-family:var(--display);font-size:1.2rem}
.cert-banner .btn{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--sun-deep)}

/* STAGE HEADER + STEPS */
.shead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.schip{font-family:var(--display);font-weight:600;background:var(--stage);color:var(--card);padding:6px 14px;border-radius:999px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.steps span{font-family:var(--display);font-size:.95rem;padding:5px 12px;border-radius:999px;background:var(--paper-2);color:var(--ink-soft)}
.steps span.on{background:var(--ink);color:var(--paper)}
.steps span.ok{background:var(--good-bg);color:var(--good)}
.prompt{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border-radius:var(--r-md);padding:12px 16px;margin-bottom:18px;box-shadow:0 3px 0 var(--line)}
.prompt .ic{font-size:1.8rem}
.prompt b{font-family:var(--display);font-size:1.15rem;font-weight:600}
.meter{display:flex;gap:6px}
.meter i{width:14px;height:14px;border-radius:50%;background:var(--paper-2);border:2px solid var(--line)}
.meter i.on{background:var(--leaf);border-color:var(--leaf)}

/* LEARN cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.wcard{position:relative;background:var(--card);border-radius:var(--r-lg);box-shadow:0 6px 0 var(--line);display:grid;overflow:hidden;transition:transform .15s}
.wcard-main{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:22px 12px 10px}
.wcard .emo{font-size:4.2rem;line-height:1.1;transition:transform .2s}
.wcard .en{font-size:2.1rem;font-weight:600;color:var(--sea)}
.wcard .he{font-size:1.05rem;color:var(--ink-soft)}
.wcard-tools{display:flex;gap:8px;justify-content:center;padding:0 10px 16px;flex-wrap:wrap}
.wcard .tick{position:absolute;top:10px;inset-inline-start:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--good);color:var(--card);font-weight:700;transform:scale(0);transition:transform .2s}
.wcard.heard .tick{transform:scale(1)}
.wcard.playing{transform:scale(1.03);box-shadow:0 6px 0 var(--sea-deep),0 0 0 4px var(--sea)}
.wcard.playing .emo{transform:scale(1.15) rotate(-6deg)}
.turn{position:absolute;inset-inline:10px;top:10px;background:var(--sun);color:var(--on-sun);border-radius:var(--r-md);padding:6px 10px;font-family:var(--display);font-weight:600;text-align:center;opacity:0;transform:translateY(-8px);transition:.2s;pointer-events:none}
.wcard.yourturn .turn{opacity:1;transform:none}
.said{font-size:.85rem;color:var(--ink-soft);text-align:center;margin-top:-8px;padding-bottom:12px;min-height:1.3em}
.cta{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}

/* MATCH */
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:22px;align-items:start}
.colh{font-family:var(--display);font-weight:600;font-size:1.05rem;margin-bottom:10px;color:var(--ink-soft)}
.wordlist{display:grid;gap:10px}
.wbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;border:3px solid transparent;background:var(--card);border-radius:var(--r-md);padding:12px 16px;box-shadow:0 4px 0 var(--line);font-size:1.6rem;transition:transform .1s}
.wbtn .en{font-weight:600;color:var(--sea)}
.wbtn .spk{font-size:1.1rem;opacity:.7}
.wbtn.sel{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 22%,var(--card));transform:translateX(-4px)}
.pics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pic{display:grid;justify-items:center;gap:2px;border:3px solid transparent;background:var(--card);border-radius:var(--r-lg);padding:14px 6px;box-shadow:0 4px 0 var(--line);transition:transform .1s}
.pic .emo{font-size:3.2rem;line-height:1.1}
.pic .he{font-size:1rem;color:var(--ink-soft)}
.pic.sel{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 22%,var(--card))}
.done{background:var(--good-bg)!important;border-color:var(--good)!important;box-shadow:none!important;opacity:.85}
.done .en{color:var(--good)}
.pic .got{font-size:.95rem;color:var(--good);font-weight:600;min-height:1.4em}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pop{animation:popin .45s}
@keyframes popin{40%{transform:scale(1.12)}}

/* QUIZ */
.quiz{display:grid;justify-items:center;gap:20px}
.speaker{width:132px;height:132px;max-width:100%;border-radius:50%;border:0;background:var(--sea);color:var(--on-sea);font-size:3.6rem;box-shadow:0 7px 0 var(--sea-deep);display:grid;place-items:center}
.speaker:active{transform:translateY(4px);box-shadow:0 3px 0 var(--sea-deep)}
.speaker.playing{animation:pulse .7s ease-in-out infinite}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;width:100%;max-width:760px}
.opt{display:grid;justify-items:center;gap:4px;border:3px solid transparent;background:var(--card);border-radius:var(--r-lg);padding:18px 6px;box-shadow:0 5px 0 var(--line);font-size:4rem;line-height:1.1}
.opt .lab{font-size:1.3rem;min-height:1.5em;font-weight:600;color:var(--good)}
.opt.no{opacity:.35;filter:grayscale(1)}
.opt.yes{background:var(--good-bg);border-color:var(--good)}

/* DONE */
.result{display:grid;justify-items:center;gap:14px;text-align:center;padding:34px 18px}
.bigstars{display:flex;gap:10px;font-size:4rem;line-height:1}
.bigstars span{opacity:.18;filter:grayscale(1);transform:scale(.6)}
.bigstars span.on{animation:starin .5s forwards}
@keyframes starin{to{opacity:1;filter:none;transform:scale(1)}}
.result h1{font-size:clamp(2rem,6vw,3rem);color:var(--sea)}
.sticker{display:inline-flex;align-items:center;gap:10px;background:var(--paper-2);border-radius:999px;padding:8px 18px;font-family:var(--display);font-size:1.1rem}
.sticker .s{font-size:2rem}
.learned{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.learned button{border:0;background:var(--card);border-radius:999px;padding:6px 14px;box-shadow:0 3px 0 var(--line);font-size:1.1rem}

/* BANK */
.bank-sec{display:grid;gap:10px}
.bank-sec h2{font-size:1.3rem;display:flex;gap:8px;align-items:center}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.bw{position:relative;display:grid;justify-items:center;border:0;background:var(--card);border-radius:var(--r-md);padding:12px 6px;box-shadow:0 4px 0 var(--line)}
.bw .emo{font-size:2.4rem}
.bw .en{font-size:1.3rem;font-weight:600;color:var(--sea)}
.bw .he{font-size:.9rem;color:var(--ink-soft)}
.bw .lv{position:absolute;top:6px;inset-inline-end:8px;font-size:1rem}
.bw.lock{opacity:.4}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink-soft);font-size:.95rem}

/* CERT */
.cert{background:var(--card);border-radius:var(--r-lg);padding:clamp(22px,5vw,48px);text-align:center;display:grid;gap:14px;justify-items:center;border:8px double var(--sun);box-shadow:0 8px 0 var(--line)}
.cert .crown{font-size:4rem}
.cert h1{font-size:clamp(1.8rem,5vw,2.8rem);color:var(--sea)}
.cert .who{font-family:var(--display);font-size:clamp(2rem,6vw,3.2rem);font-weight:700}
.cert .emos{font-size:1.6rem;letter-spacing:4px;line-height:1.6;max-width:36ch}

/* PIN */
.pin{max-width:360px;margin:30px auto;display:grid;gap:18px;justify-items:center;text-align:center}
.pindots{display:flex;gap:14px}
.pindots i{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink-soft)}
.pindots i.on{background:var(--ink);border-color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:12px;direction:ltr}
.keys button{height:64px;border:0;border-radius:var(--r-md);background:var(--card);box-shadow:0 4px 0 var(--line);font-family:var(--display);font-size:1.6rem;font-weight:600}
.pinmsg{min-height:1.5em;color:var(--bad);font-weight:500}

/* TEACHER */
.t{font-family:var(--body)}
.thead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.thead h1{font-size:1.7rem}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;padding:5px 12px;border-radius:999px;background:var(--paper-2);color:var(--ink-soft)}
.mode.cloud{background:var(--good-bg);color:var(--good)}
.mode.warn{background:var(--warn-bg);color:var(--warn)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 16px;font-weight:500;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sea)}
.tbox{background:var(--card);border-radius:var(--r-md);padding:18px;border:1px solid var(--line);min-width:0}
.tbox h2{font-family:var(--body);font-size:1.05rem;font-weight:700;margin-bottom:12px}
.tbox h2 small{font-weight:400;color:var(--ink-soft);font-size:.85rem;margin-inline-start:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;display:grid;gap:2px;min-width:0}
.kpi .l{font-size:.85rem;color:var(--ink-soft)}
.kpi .v{font-family:var(--display);font-size:1.9rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .h{font-size:.82rem;color:var(--ink-soft)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;margin-bottom:16px}
.hbars{display:grid;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) 3.6em;gap:10px;align-items:center;font-size:.92rem}
.hbar .track{height:14px;background:var(--paper-2);border-radius:999px;overflow:hidden}
.hbar .fill{height:100%;border-radius:999px;background:var(--sea)}
.hbar .val{font-variant-numeric:tabular-nums;text-align:end;color:var(--ink-soft)}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cols{display:flex;align-items:flex-end;gap:5px;height:150px;border-bottom:1px solid var(--line);position:relative;padding-top:8px;direction:ltr}
.cols .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.cols .b{width:100%;max-width:26px;background:var(--sea);border-radius:5px 5px 0 0;min-height:2px}
.cols .b.zero{background:var(--line)}
.cols .b.today{background:var(--sun-deep)}
.colx{display:flex;gap:5px;direction:ltr;font-size:.72rem;color:var(--ink-soft);margin-top:4px}
.colx span{flex:1;text-align:center;font-variant-numeric:tabular-nums;min-width:0}
.ymax{position:absolute;top:0;left:0;font-size:.75rem;color:var(--ink-soft);background:var(--card);padding-inline-end:4px}
.gridline{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.alist{display:grid;gap:8px}
.aitem{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border-radius:var(--r-sm);background:var(--paper);border:0;text-align:start;width:100%}
.aitem .av{font-size:1.5rem}
.pill{display:inline-flex;align-items:center;font-size:.8rem;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.neutral{background:var(--paper-2);color:var(--ink-soft)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--ink-soft);font-size:.83rem;background:var(--paper)}
th button{border:0;background:transparent;font:inherit;color:inherit;padding:0}
th button[aria-pressed="true"]{color:var(--ink);font-weight:700}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--paper) 60%,var(--card))}
td.num{font-variant-numeric:tabular-nums}
.namebtn{border:0;background:transparent;padding:0;display:inline-flex;gap:8px;align-items:center;font-weight:500;color:var(--sea)}
.namebtn .av{font-size:1.3rem}
.pips{display:inline-flex;gap:3px}
.pips i{width:16px;height:16px;border-radius:4px;background:var(--paper-2);font-style:normal;font-size:.62rem;display:grid;place-items:center;color:var(--on-sun)}
.pips i.d1{background:color-mix(in srgb,var(--sun) 45%,var(--paper-2))}
.pips i.d2{background:color-mix(in srgb,var(--sun) 75%,var(--paper-2))}
.pips i.d3{background:var(--sun)}
.accbar{display:inline-flex;align-items:center;gap:8px}
.accbar .track{width:60px;height:8px;background:var(--paper-2);border-radius:999px;overflow:hidden}
.accbar .fill{height:100%;background:var(--good)}
.accbar .fill.m{background:var(--warn)}
.accbar .fill.l{background:var(--bad)}
.addform{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.addform input{flex:1;min-width:0;max-width:340px;font-size:1rem;padding:10px 12px}
.mgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.mcell{border-radius:var(--r-sm);padding:8px 4px;text-align:center;background:var(--paper-2);border:2px solid transparent;display:grid;gap:0;min-width:0}
.mcell .emo{font-size:1.4rem}
.mcell .en{font-size:.85rem;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.mcell .n{font-size:.7rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.mcell.l1{background:var(--warn-bg)}
.mcell.l2{background:var(--good-bg);border-color:var(--good)}
.mcell.lx{background:var(--bad-bg);border-color:var(--bad)}
.mlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:.83rem;color:var(--ink-soft);margin-top:10px}
.mlegend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-inline-end:5px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bad-bg);color:var(--bad);border-radius:var(--r-sm);padding:10px 14px}
.btn.danger{background:var(--bad);color:var(--card);box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.demo-banner{background:var(--warn-bg);color:var(--warn);border-radius:var(--r-sm);padding:10px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.empty{text-align:center;padding:40px 16px;display:grid;gap:12px;justify-items:center}
.empty .ic{font-size:3rem}
.set{display:grid;gap:10px;max-width:520px}
.toggle{display:flex;align-items:center;gap:10px}
.toggle input{width:22px;height:22px;accent-color:var(--sea)}
textarea{font:inherit;font-size:.82rem;width:100%;min-height:120px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px;direction:ltr}
.note{font-size:.88rem;color:var(--ink-soft)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:500;z-index:50;max-width:calc(100% - 32px)}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

@media (max-width:760px){
  .islands{grid-template-columns:1fr;gap:6px;justify-items:center}
  .islands::before{inset-inline:auto;left:50%;top:40px;bottom:40px;border-top:0;border-left:5px dashed var(--line)}
  .island{grid-template-columns:auto 1fr;justify-items:start;text-align:start;align-items:center;gap:4px 14px;width:min(100%,360px);background:var(--paper);border-radius:var(--r-lg);padding:8px}
  .island .blob{grid-row:span 4;width:92px}
  .match{grid-template-columns:1fr}
  .wordlist{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pics{grid-template-columns:repeat(3,minmax(0,1fr))}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:420px){
  .pics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wbtn{font-size:1.3rem;padding:10px 12px}
  .cards{grid-template-columns:1fr 1fr;gap:10px}
  .wcard .emo{font-size:3rem}.wcard .en{font-size:1.6rem}
  .hbar{grid-template-columns:minmax(0,7em) minmax(0,1fr) 3.2em}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* v2: pronunciation check, teacher word lists, uploaded pictures */
.wimg{height:1.15em;width:auto;max-width:100%;object-fit:contain;border-radius:12px;display:block}
.wcard.ok{box-shadow:0 6px 0 var(--good),0 0 0 3px var(--good)}
.wcard.ok .tick{background:var(--sun);color:var(--on-sun);transform:scale(1)}
.wcard.listening{box-shadow:0 6px 0 var(--sun-deep),0 0 0 4px var(--sun)}
.wcard.listening .mic{animation:pulse .8s ease-in-out infinite}
.said.good{color:var(--good);font-weight:600}
.said.bad{color:var(--bad);font-weight:500}
.speakrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 10px 10px}
.meter i.half{background:color-mix(in srgb,var(--leaf) 35%,var(--paper-2));border-color:var(--leaf)}
.tlists{margin-top:30px;display:grid;gap:12px}
.tlists h2{font-size:1.4rem}
.tlgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tlist{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;text-align:start;border:0;background:var(--card);border-radius:var(--r-lg);padding:12px 14px;box-shadow:0 5px 0 var(--line)}
.tlist .ic{grid-row:span 3;font-size:2.4rem;width:3.2rem;display:grid;place-items:center}
.tlist .ic .wimg{height:2.6rem}
.tlist b{font-family:var(--display);font-size:1.15rem}
.tlist small{color:var(--ink-soft)}
.lcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.lcard{display:grid;gap:10px}
.lcard .chips{display:flex;gap:6px;flex-wrap:wrap}
.lcard .chips span{background:var(--paper);border-radius:999px;padding:3px 10px;font-size:.9rem;display:inline-flex;gap:5px;align-items:center}
.lcard .chips .wimg{height:1.2em;border-radius:4px}
.lrows{display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:2.6rem 3.4rem minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--paper);border-radius:var(--r-sm);padding:8px}
.lrow input[type=text]{font-size:1rem;padding:8px 10px;background:var(--card)}
.lrow .lemo{text-align:center;padding:8px 2px}
.lrow .lpic{font-size:1.8rem;display:grid;place-items:center;height:2.6rem}
.lrow .lpic .wimg{height:2.4rem}
.lrow .tools{display:flex;gap:6px;flex-wrap:wrap}
.lrow .tools .btn{padding:6px 10px}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.btn.has{background:var(--good-bg);color:var(--good)}
details summary{cursor:pointer;font-weight:500;padding:4px 0}
.pickstud{display:flex;gap:6px 16px;flex-wrap:wrap;padding-top:4px}
fieldset{border:0;padding:0;margin:0}
legend{font-weight:500;padding:0;margin-bottom:6px}
.formmsg{color:var(--bad);font-weight:500;min-height:1.4em}
.radios{display:grid;gap:8px}
@media (max-width:760px){
  .lrow{grid-template-columns:2.6rem 3.4rem minmax(0,1fr)}
  .lrow input[data-f="he"]{grid-column:2 / 4}
  .lrow .tools{grid-column:1 / -1}
}
</style>

  unlock(){ try{ if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext; if(C) this.ctx=new C();}
    if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); }catch(e){} },
  async load(key,uri){ if(this.buf[key]) return this.buf[key]; if(!uri||!this.ctx) return null;
    const bin=atob(uri.slice(uri.indexOf(',')+1)); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    const ab=await new Promise((res,rej)=>{ const p=this.ctx.decodeAudioData(arr.buffer,res,rej); if(p&&p.then) p.then(res,rej); });
    this.buf[key]=ab; return ab; },
  stop(){ this.seq++; try{this.src&&this.src.stop();}catch(e){} this.src=null; if(this.el){try{this.el.pause();}catch(e){} this.el=null;} try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){} },

      try{ const b=await this.load(key,uri); if(my!==this.seq) return fin();
        if(b){ const s=this.ctx.createBufferSource(); s.buffer=b; s.playbackRate.value=rate; s.connect(this.ctx.destination); s.onended=fin; this.src=s; s.start(); setTimeout(fin,b.duration/rate*1000+300); return; } }catch(e){}
      if(my!==this.seq) return fin();

      const v=speechSynthesis.getVoices().find(v=>/^en(-|_)US/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang)); if(v) u.voice=v;

    let r; try{ r=new R(); }catch(e){ this.ok=false; return res({err:'unsupported'}); }
    r.lang='en-US'; r.maxAlternatives=8; r.interimResults=false; r.continuous=false;
    let done=false,audio=false; const fin=v=>{ if(done) return; done=true; try{r.abort();}catch(e){} res(v); };
    r.onaudiostart=()=>{ audio=true; };
    r.onresult=e=>{ const alts=[]; for(const x of e.results) for(let i=0;i<x.length;i++) alts.push(x[i].transcript); this.ok=true; fin({alts}); };
    r.onerror=e=>{ if(['not-allowed','service-not-allowed','audio-capture','network'].includes(e.error)) this.ok=false; fin({err:e.error}); };
    r.onend=()=>setTimeout(()=>fin({alts:[]}),250);
    try{ r.start(); }catch(e){ this.ok=false; fin({err:'start'}); }
    setTimeout(()=>{ if(!audio) this.ok=false; fin({alts:[],timeout:true,err:audio?null:'no-audio'}); },6500); }); },
  match(target,alts){ const n=s=>String(s).toLowerCase().replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim(); const t=n(target); if(!t) return false;
    const H={sun:['son','sunny'],red:['read','redd'],heart:['hart'],flower:['flour'],eat:['eats'],run:['ron'],car:['cars'],book:['books'],star:['stars'],tree:['three'],sing:['sink'],cold:['code']};
    const lev=(a,b)=>{ const d=[...Array(b.length+1).keys()]; for(let i=1;i<=a.length;i++){ let p=d[0]; d[0]=i; for(let j=1;j<=b.length;j++){ const q=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1)); p=q; } } return d[b.length]; };
    return alts.some(a=>{ const s=n(a); if(!s) return false; if((' '+s+' ').includes(' '+t+' ')) return true; const ws=s.split(' ');
      if((H[t]||[]).some(h=>ws.includes(h))) return true; if(t.length>=5&&ws.some(x=>lev(x,t)<=1)) return true; return t.includes(' ')&&lev(s,t)<=2; }); }
};

/* ---------- confetti ---------- */
const FX={parts:[],run:false,
  burst(n=120){ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; const cv=$('#fx'); cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio;
    const cs=getComputedStyle(document.documentElement); const cols=['--sun','--coral','--leaf','--sea','--grape'].map(v=>cs.getPropertyValue(v).trim());
    for(let i=0;i<n;i++) this.parts.push({x:cv.width/2+(Math.random()-.5)*cv.width*.3,y:cv.height*.35,vx:(Math.random()-.5)*18*devicePixelRatio,vy:(-Math.random()*16-6)*devicePixelRatio,s:(6+Math.random()*7)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%cols.length],life:140});
    if(!this.run){this.run=true;requestAnimationFrame(()=>this.tick());} },
  tick(){ const cv=$('#fx'),x=cv.getContext('2d'); x.clearRect(0,0,cv.width,cv.height);
    this.parts=this.parts.filter(p=>p.life-->0&&p.y<cv.height+40);
    for(const p of this.parts){ p.vy+=.45*devicePixelRatio; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.globalAlpha=Math.min(1,p.life/40); x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66); x.restore(); }
    if(this.parts.length) requestAnimationFrame(()=>this.tick()); else {this.run=false; x.clearRect(0,0,cv.width,cv.height);} }
};

/* ---------- storage: shared database when available, this browser otherwise ---------- */
const LS=MICAPP?'word-island-class-v1':'word-island-v1', LSM=MICAPP?'word-island-class-media-v1':'word-island-media-v1';
const Store={db:null,mode:'local',readOnly:false,students:{},lists:{},media:{},settings:{pin:'2008',openAll:false,sfx:true,speak:'auto'},dirty:new Set(),timers:{},chains:{},
  loadLocal(){ try{ const d=JSON.parse(localStorage.getItem(LS)||'null'); if(d){ this.students=d.students||{}; this.lists=d.lists||{}; Object.assign(this.settings,d.settings||{}); } }catch(e){}
    try{ this.media=JSON.parse(localStorage.getItem(LSM)||'{}')||{}; }catch(e){} rebuildCW(); },
  saveLocal(){ try{ localStorage.setItem(LS,JSON.stringify({students:this.students,lists:this.lists,settings:this.settings})); }catch(e){} },
  saveMediaLocal(){ try{ localStorage.setItem(LSM,JSON.stringify(this.media)); }catch(e){} },
  async connectGas(){ this.mode='gas';
    const pull=async()=>{ try{ const d=JSON.parse(await gas('loadAll')); const next={};
        for(const [id,c] of Object.entries(d.students||{})){ const l=this.students[id]; next[id]=(l&&(this.dirty.has(id)||this.chains[id]||(l.updatedAt||0)>(c.updatedAt||0)))?l:c; }
        for(const [id,l] of Object.entries(this.students)){ if(!next[id]&&(!l.cloud||this.dirty.has(id))){ next[id]=l; this.save(id,true); } }
        this.students=next; if(d.lists) this.lists=d.lists; if(d.media) this.media=d.media; if(d.settings) Object.assign(this.settings,d.settings);
        this.online=true; rebuildCW(); this.saveLocal(); this.saveMediaLocal(); App.onData(); }catch(e){ this.online=false; App.onData(); } };
    await pull(); setInterval(()=>{ if(!document.hidden&&['who','teacher','map'].includes(App.screen)) pull(); },25000); },
  async connect(){
    if(GAS) return this.connectGas();
    let db=null; try{ db=window.claude&&window.claude.use? await window.claude.use('db'):null; }catch(e){ db=null; }
    if(!db) return; this.db=db; this.mode='cloud'; let first=true;
    db.collection('students').onSnapshot(snap=>{
      const cloud={}; snap.docs.forEach(d=>{ cloud[d.id]=JSON.parse(JSON.stringify(d.data())); });
      const next={};
      for(const [id,c] of Object.entries(cloud)){ const l=this.students[id];
        next[id]=(l&&(this.dirty.has(id)||this.chains[id]||(l.updatedAt||0)>(c.updatedAt||0)))? l : c; }
      for(const [id,l] of Object.entries(this.students)){ if(!cloud[id]&&(!l.cloud||this.dirty.has(id))){ next[id]=l; if(first) this.save(id,true); } }
      first=false; this.students=next; this.saveLocal(); App.onData();
    }, ()=>{ this.mode='local'; App.onData(); });
    this.syncSimple('lists','lists',()=>{ rebuildCW(); this.saveLocal(); });
    this.syncSimple('media','media',()=>{ rebuildCW(); this.saveMediaLocal(); });
    db.doc('settings/main').onSnapshot(s=>{ if(s.exists){ Object.assign(this.settings,JSON.parse(JSON.stringify(s.data()))); this.saveLocal(); App.onData(); } },()=>{});
    App.onData();
  },
  syncSimple(col,prop,after){ let first=true;
    this.db.collection(col).onSnapshot(snap=>{ const next={}; snap.docs.forEach(d=>{ next[d.id]=JSON.parse(JSON.stringify(d.data())); });
      if(first){ for(const [id,v] of Object.entries(this[prop])){ if(!next[id]&&!v.cloud){ next[id]=v; this.put(col,id,v); } } first=false; }
      this[prop]=next; after(); App.onData(); },()=>{}); },
  async put(col,id,v){ if(GAS){ v.cloud=true; try{ await gas('saveDoc',col,id,JSON.stringify(v),null); }catch(e){ toast('השמירה בגיליון נכשלה. בדקו את החיבור לאינטרנט.'); } return; }
    if(!this.db||this.readOnly) return; v.cloud=true; try{ await this.db.doc(col+'/'+id).set(JSON.parse(JSON.stringify(v))); }catch(e){ if(e&&e.code==='invalid_argument'){ this.readOnly=true; App.onData(); } else if(e&&e.code==='quota_exceeded') toast('המאגר מלא. מחקו רשימות ישנות.'); } },
  async del(col,id){ if(GAS){ try{ await gas('deleteDoc',col,id); }catch(e){} return; } if(!this.db||this.readOnly) return; try{ await this.db.doc(col+'/'+id).delete(); }catch(e){} },
  save(id,now){ const s=this.students[id]; if(!s) return; s.updatedAt=Date.now(); this.saveLocal();
    if(!GAS&&(!this.db||this.readOnly)) return; this.dirty.add(id); clearTimeout(this.timers[id]); this.timers[id]=setTimeout(()=>this.flush(id),now?0:1500); },
  flush(id){ const run=async()=>{ if(!this.dirty.has(id)) return; this.dirty.delete(id); const s=this.students[id]; if(!s) return; s.cloud=true;
      try{ if(GAS) await gas('saveDoc','students',id,JSON.stringify(s),sumRow(s)); else await this.db.doc('students/'+id).set(JSON.parse(JSON.stringify(s))); }
      catch(e){ const c=e&&e.code; if(c==='invalid_argument'){ this.readOnly=true; App.onData(); } else if(c==='unavailable'){ this.dirty.add(id); setTimeout(()=>this.flush(id),1500+Math.random()*2000); } } };
    const p=(this.chains[id]||Promise.resolve()).then(run); this.chains[id]=p; p.finally(()=>{ if(this.chains[id]===p) delete this.chains[id]; }); },
  flushAll(){ for(const id of [...this.dirty]){ clearTimeout(this.timers[id]); this.flush(id); } },
  add(name,avatar){ const id=uid('s');
    this.students[id]={id,name:name.trim().slice(0,30),avatar,createdAt:Date.now(),updatedAt:Date.now(),words:{},stages:{},days:{},lastActive:0}; this.save(id,true); return id; },
  remove(id){ delete this.students[id]; this.dirty.delete(id); this.saveLocal(); this.del('students',id);
    for(const l of Object.values(this.lists)) if(Array.isArray(l.to)&&l.to.includes(id)){ l.to=l.to.filter(x=>x!==id); this.saveLocal(); this.put('lists',l.id,l); } },
  reset(id){ const s=this.students[id]; if(!s) return; Object.assign(s,{words:{},stages:{},days:{},lastActive:0}); this.save(id,true); },
  setSettings(p){ Object.assign(this.settings,p); this.saveLocal(); if(GAS){ gas('saveDoc','settings','main',JSON.stringify(this.settings),null).catch(()=>{}); return; } if(this.db&&!this.readOnly) this.db.doc('settings/main').set(JSON.parse(JSON.stringify(this.settings))).catch(e=>{ if(e&&e.code==='invalid_argument'){this.readOnly=true;App.onData();} }); },
  async saveList(meta,media,removed){ meta.updatedAt=Date.now(); this.lists[meta.id]=meta;
    for(const [wid,m] of Object.entries(media)) this.media[wid]=m; for(const wid of removed) delete this.media[wid];
    rebuildCW(); this.saveLocal(); this.saveMediaLocal();
    await this.put('lists',meta.id,meta); for(const [wid,m] of Object.entries(media)) await this.put('media',wid,m); for(const wid of removed) await this.del('media',wid); },
  removeList(id){ const l=this.lists[id]; if(!l) return; delete this.lists[id]; for(const w of l.words||[]){ delete this.media[w.id]; this.del('media',w.id); } rebuildCW(); this.saveLocal(); this.saveMediaLocal(); this.del('lists',id); }
};

/* ---------- progress model ---------- */
function ws(s,id){ s.words=s.words||{}; const x=s.words[id]||(s.words[id]={h:0,sl:0,r:0,ma:0,mo:0,qa:0,qo:0,x:0,t:0}); for(const k of ['sv','st','sa']) x[k]=x[k]||0; return x; }
// h listens · sl slow listens · r said correctly (checked or approved) · sv/st recognised by microphone / microphone tries · sa approved by an adult
// ma/mo match attempts & first-try right · qa/qo listening-quiz attempts & first-try right · x wrong picks
function level(w){ if(!w) return 0; const att=w.ma+w.qa, ok=w.mo+w.qo;
  if(att>=2&&w.x>=3&&ok/att<.5) return -1; if(w.qa>0&&w.qo>0&&ok/att>=.75) return 2; if(w.h+w.sl>0||att>0) return 1; return 0; }
const skey=k=>typeof k==='number'?k:'L'+k;
function summary(s,words){ words=words||wordsFor(s); let att=0,ok=0,listens=0,rep=0,mast=0,strug=0,seen=0,st=0,sv=0,said=0;
  for(const w of words){ const x=s.words&&s.words[w.id]; if(!x) continue; att+=x.ma+x.qa; ok+=x.mo+x.qo; listens+=x.h+x.sl; rep+=x.r; st+=x.st||0; sv+=x.sv||0; if(x.r>0) said++;
    const l=level(x); if(l===2)mast++; if(l===-1)strug++; if(l!==0)seen++; }
  const stg=s.stages||{}; const done=STAGES.filter(t=>stg[t.n]&&stg[t.n].done).length; const stars=STAGES.reduce((a,t)=>a+((stg[t.n]&&stg[t.n].stars)||0),0);
  const lists=listsFor(s); const ldone=lists.filter(l=>stg['L'+l.id]&&stg['L'+l.id].done).length;
  const secs=Object.values(s.days||{}).reduce((a,b)=>a+b,0);
  return {att,ok,acc:att?ok/att:null,listens,rep,mast,strug,seen,done,stars,secs,st,sv,said,total:words.length,lists:lists.length,ldone,last:s.lastActive||0,current:Math.min(5,done+1)}; }
function sumRow(s){ const m=summary(s); return [s.name,m.done,m.lists?m.ldone+'/'+m.lists:'',m.stars,m.acc==null?'':Math.round(m.acc*100)+'%',m.mast,m.said,m.total,Math.round(m.secs/60),m.last?new Date(m.last).toLocaleString('he-IL'):'',s.id]; }
function unlocked(s,n){ return typeof n!=='number'||n===1||Store.settings.openAll||!!(s.stages&&s.stages[n-1]&&s.stages[n-1].done); }
function attention(s,m){ const r=[]; if(!m.last) { r.push(['neutral','עוד לא התחיל/ה']); return r; }
  if(m.att>=6&&m.acc<.6) r.push(['bad','דיוק נמוך '+pct(m.acc)]);
  if(m.strug>=2) r.push(['bad','מתקשה ב-'+m.strug+' מילים']);
  if(m.st>=6&&m.sv/m.st<.4) r.push(['warn','קושי בהגייה']);
  const d=Math.floor((Date.now()-m.last)/86400000); if(d>=7) r.push(['warn','לא שיחק/ה '+d+' ימים']);
  return r; }
function status(m){ if(!m.last) return ['neutral','חדש/ה']; if(m.att>=6&&m.acc<.6||m.strug>=2) return ['bad','צריך/ה עזרה']; if(m.done===5) return ['good','סיים/ה את האי']; if(m.att>=6&&m.acc>=.85) return ['good','מצוין']; return ['warn','בדרך']; }

/* ---------- active-time tracking ---------- */
let lastInput=Date.now(), unsavedSecs=0;
setInterval(()=>{ const s=App.s; if(!s||!App.kidScreen()||document.hidden||Date.now()-lastInput>45000) return;
  const k=dayKey(); s.days=s.days||{}; s.days[k]=(s.days[k]||0)+5; s.lastActive=Date.now(); unsavedSecs+=5;
  if(unsavedSecs>=60){ unsavedSecs=0; pruneDays(s); Store.save(s.id); } },5000);
function pruneDays(s){ const cut=dayKey(new Date(Date.now()-90*86400000)); for(const k of Object.keys(s.days||{})) if(k<cut) delete s.days[k]; }
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(App.s&&unsavedSecs){unsavedSecs=0;Store.save(App.s.id,true);} Store.flushAll(); } });

async function hear(id,slow){ const s=App.s; if(!s){ Sound.word(id,slow); return; } const g=App.screen==='learn'?App.g:null; const x=ws(s,id); slow?x.sl++:x.h++; x.t=Date.now(); touch();
  const card=document.querySelector(`[data-card="${id}"]`); document.querySelectorAll('.wcard.playing,.wcard.yourturn').forEach(c=>c.classList.remove('playing','yourturn'));
  card&&card.classList.add('playing'); if(g) g.heard.add(id); updateLearn();
  const my=++hear.n; await Sound.word(id,slow); if(my!==hear.n) return;
  if(card){ card.classList.remove('playing'); card.classList.add('heard'); if(!(g&&g.ok.has(id))){ card.classList.add('yourturn'); setTimeout(()=>card.classList.remove('yourturn'),2600); } }
  Store.save(s.id); }
hear.n=0;
function setSaid(id,text,cls=''){ const d=document.querySelector(`[data-said="${id}"]`); if(d){ d.textContent=text; d.className='said '+cls; } }
function updateLearn(){ const g=App.g; if(!g||App.screen!=='learn') return; const m=$('#meter'); if(m) m.innerHTML=meterHTML();
  const b=$('#go-match'); if(b&&gateDone()&&b.disabled){ b.disabled=false; b.classList.add('pulse'); b.textContent='ממשיכים להתאמה ←'; setTimeout(()=>Sound.sfx('star'),700); } }
function verify(id){ const g=App.g; g.ok.add(id); const c=document.querySelector(`[data-card="${id}"]`);
  if(c){ c.classList.add('ok','pop'); c.classList.remove('yourturn','listening'); c.querySelector('.tick').textContent='⭐'; setTimeout(()=>c.classList.remove('pop'),450); }
  const sp=document.querySelector(`[data-speak="${id}"]`); if(sp) sp.innerHTML=myVoiceBtn(id); setSaid(id,'⭐ אמרת נכון!','good'); Sound.sfx('star'); updateLearn(); Store.save(App.s.id); }
async function micCheck(id){ const g=App.g,s=App.s,w=getWord(id); if(!g.heard.has(id)){ toast('קודם הקשיבו למילה 🔊'); return; } if(Speak.busy) return;
  Speak.busy=true; Sound.stop(); const card=document.querySelector(`[data-card="${id}"]`); card&&card.classList.add('listening'); setSaid(id,'👂 מקשיב... אמרו: '+w.en);
  await sleep(150); const r=await Speak.listen();
  Speak.busy=false; card&&card.classList.remove('listening'); if(App.screen!=='learn'||App.g!==g) return;
  const sp0=document.querySelector(`[data-speak="${id}"]`);
  if(r.err&&!['no-speech','aborted'].includes(r.err)&&!(r.alts||[]).length){
    if(!MICAPP){ g.mode='adult'; toast('אין גישה למיקרופון כאן. מבוגר יאשר את ההגייה 👍'); render(); return; }
    const M={'not-allowed':'הדפדפן חוסם את המיקרופון. לחצו על סמל המנעול ליד הכתובת ← מיקרופון ← לאפשר, ואז נסו שוב.','service-not-allowed':'הדפדפן לא מאפשר זיהוי דיבור. נסו ב-Chrome או ב-Edge רגיל (לא בחלון גלישה בסתר).','audio-capture':'לא נמצא מיקרופון. בדקו שהמיקרופון מחובר ונסו שוב.','network':'זיהוי הדיבור צריך חיבור לאינטרנט. בדקו את החיבור ונסו שוב.','no-audio':'המיקרופון לא נפתח. לחצו שוב על 🎤 ואשרו את המיקרופון אם הדפדפן שואל.','unsupported':'הדפדפן הזה לא תומך בזיהוי דיבור. השתמשו ב-Chrome או ב-Edge.'};
    setSaid(id,(M[r.err]||('תקלה בזיהוי הדיבור ('+r.err+'). נסו שוב.')),'bad'); Speak.ok=null;
    g.micDown=true; g.tries[id]=(g.tries[id]||0)+1; if(sp0) sp0.innerHTML=speakTools(w); return; }
  if(!(r.alts||[]).length){ g.tries[id]=(g.tries[id]||0)+1; setSaid(id,'לא שמעתי כלום · לחצו 🎤 ודברו בקול וברור','bad'); if(sp0) sp0.innerHTML=speakTools(w); return; }
  const x=ws(s,id); x.st++; touch();
  if(Speak.match(w.en,r.alts||[])){ x.sv++; x.r++; verify(id); return; }
  g.tries[id]=(g.tries[id]||0)+1; const said=(r.alts&&r.alts[0])?'שמעתי: "'+r.alts[0]+'" · נסו שוב':'לא שמעתי טוב · נסו שוב, קרוב יותר למחשב';
  setSaid(id,said,'bad'); Sound.sfx('bad'); setTimeout(()=>{ if(App.screen==='learn') Sound.word(id,true); },600);
  const sp=document.querySelector(`[data-speak="${id}"]`); if(sp) sp.innerHTML=speakTools(w);
  Store.save(s.id); }

function toQuiz(){ const g=App.g; const prev=g.n?WORDS.filter(w=>w.stage<g.n):[];
  g.q={order:shuffle(g.words.map(w=>w.id)),i:0,tries:0,mist:0,lock:false,opts:[],prev}; makeOpts(); App.go('quiz'); setTimeout(()=>{ if(App.screen==='quiz') qPlay(); },600); }
function makeOpts(){ const g=App.g,q=g.q,t=q.order[q.i]; const same=shuffle(g.words.filter(w=>w.id!==t).map(w=>w.id));
  let pool=same.slice(0,q.prev.length?2:3); if(q.prev.length) pool.push(shuffle(q.prev)[0].id);
  if(pool.length<3) pool=pool.concat(shuffle(WORDS.filter(w=>w.id!==t&&!pool.includes(w.id))).slice(0,3-pool.length).map(w=>w.id));
  q.opts=shuffle([t,...pool]); q.tries=0; }

function finishStage(){ const g=App.g,s=App.s; const mist=g.m.mist+g.q.mist; const stars=mist<=1?3:mist<=4?2:1; const secs=Math.round((Date.now()-g.start)/1000);

function pinKey(k){ if(k==='back') App.pin=App.pin.slice(0,-1); else if(App.pin.length<4) App.pin+=k; App.pinMsg='';
  if(App.pin.length===4){ if(App.pin===String(Store.settings.pin||'2008')){ App.pin=''; App.t.detail=null; App.go('teacher'); return; } App.pin=''; App.pinMsg='הקוד לא נכון. נסו שוב.'; Sound.sfx('bad'); render(); $('#pindots').classList.add('shake'); return; }

function demoData(){ let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const names=[['נועה','🦊'],['איתי','🐼'],['מאיה','🦄'],['יונתן','🐸'],['תמר','🐝'],['אורי','🦁'],['שירה','🐧'],['עומר','🐢']]; const out={};
  names.forEach(([n,a],i)=>{ const reach=[5,4,3,3,2,2,1,0][i]; const skill=[.95,.85,.9,.6,.75,.45,.8,.7][i]; const s={id:'demo'+i,name:n,avatar:a,words:{},stages:{},days:{},lastActive:0};
    for(const w of WORDS){ if(!reach) break; if(w.stage>reach+(reach<5?1:0)) continue; const inStage=w.stage<=reach; const hard=['fast','bread','water','sleep','cold','heart'].includes(w.id)?.25:0;
      const x={h:2+Math.floor(rnd()*5),sl:Math.floor(rnd()*3),r:0,ma:0,mo:0,qa:0,qo:0,x:0,t:0,st:0,sv:0,sa:0};
      if(inStage){ x.ma=1; x.mo=rnd()<skill-hard?1:0; x.qa=1; x.qo=rnd()<skill-hard?1:0; x.x=(2-x.mo-x.qo)+(rnd()<.3?1:0); x.st=1+Math.floor(rnd()*(3-skill*2)); x.sv=1; x.r=1; }
      s.words[w.id]=x; }
    for(let k=1;k<=reach;k++) s.stages[k]={done:true,stars:Math.max(1,Math.min(3,Math.round(skill*3+rnd()*.6-.2))),plays:1+Math.floor(rnd()*2),best:180+Math.floor(rnd()*240)};
    const lastDays=[0,1,0,3,9,2,0,0][i]; if(reach){ for(let d=0;d<14;d++){ if(d<lastDays) continue; if(rnd()<.5) s.days[dayKey(new Date(Date.now()-d*86400000))]=Math.floor(120+rnd()*600); } s.lastActive=Date.now()-lastDays*86400000-3600000; }
    out[s.id]=s; }); return out; }

function colChart(days,label){ const max=Math.max(5,...days.map(d=>d.v)); const nice=max<=10?Math.ceil(max/5)*5:max<=60?Math.ceil(max/10)*10:Math.ceil(max/30)*30; const today=dayKey();

function fileToImg(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const m=240,sc=Math.min(1,m/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(im.width*sc)); c.height=Math.max(1,Math.round(im.height*sc)); const x=c.getContext('2d'); x.fillStyle='#ffffff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.8)); }; im.onerror=rej; im.src=fr.result; }; fr.onerror=rej; fr.readAsDataURL(file); }); }
async function fileToClip(file){ Sound.unlock(); const ctx=Sound.ctx; if(!ctx) throw new Error('no audio');
  const ab=await file.arrayBuffer(); const buf=await new Promise((res,rej)=>{ const p=ctx.decodeAudioData(ab,res,rej); if(p&&p.then) p.then(res,rej); });
  const ch=buf.numberOfChannels,len=buf.length,sr=buf.sampleRate; const mono=new Float32Array(len); for(let c=0;c<ch;c++){ const d=buf.getChannelData(c); for(let i=0;i<len;i++) mono[i]+=d[i]/ch; }
  let peak=0; for(let i=0;i<len;i++) peak=Math.max(peak,Math.abs(mono[i])); if(peak<.005) throw new Error('silent');
  const th=Math.max(.015,peak*.08); let a=0,b=len-1; while(a<len&&Math.abs(mono[a])<th) a++; while(b>a&&Math.abs(mono[b])<th) b--;
  a=Math.max(0,a-Math.round(sr*.08)); b=Math.min(len-1,b+Math.round(sr*.15)); let seg=mono.subarray(a,b+1); if(seg.length>sr*3) seg=seg.subarray(0,sr*3);
  const R=16000,n=Math.max(1,Math.round(seg.length*R/sr)),gain=Math.min(4,.9/peak); const out=new Int16Array(n);
  for(let i=0;i<n;i++){ const t=i*sr/R,i0=Math.floor(t),f=t-i0; const v=((seg[i0]||0)*(1-f)+(seg[i0+1]||0)*f)*gain; out[i]=Math.max(-1,Math.min(1,v))*32767; }
  const bytes=new ArrayBuffer(44+n*2),dv=new DataView(bytes); const wr=(o,s)=>{ for(let i=0;i<s.length;i++) dv.setUint8(o+i,s.charCodeAt(i)); };
  wr(0,'RIFF'); dv.setUint32(4,36+n*2,true); wr(8,'WAVE'); wr(12,'fmt '); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true); dv.setUint32(24,R,true); dv.setUint32(28,R*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true); wr(36,'data'); dv.setUint32(40,n*2,true);
  new Int16Array(bytes,44).set(out); let s=''; const u=new Uint8Array(bytes); for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));
  return 'data:audio/wav;base64,'+btoa(s); }

    ${c?`<div class="confirm"><b>למחוק את כל התלמידים וכל הנתונים?</b><span class="spacer"></span><button class="btn small danger" data-act="t-wipe">כן, למחוק הכול</button><button class="btn small" data-act="t-cancel">ביטול</button></div>`:`<div><button class="btn small ghost" style="color:var(--bad)" data-act="t-ask" data-type="wipe">מחיקת כל נתוני התלמידים</button></div>`}</div></div>`; }

function csv(){ const q=v=>'"'+String(v).replace(/"/g,'""')+'"'; const head=['שם','שלבים שהושלמו','רשימות שהושלמו','כוכבים','דיוק בניסיון ראשון','מילים שנשלטו','מילים שנאמרו נכון','סה״כ מילים','מילים לחיזוק','האזנות','דקות תרגול','פעילות אחרונה'];
  const rows=tStudents().map(s=>{const m=summary(s); const weak=wordsFor(s).filter(w=>level(s.words&&s.words[w.id])===-1).map(w=>w.en).join(' ');
    return [s.name,m.done,m.lists?m.ldone+'/'+m.lists:'',m.stars,m.acc==null?'':Math.round(m.acc*100)+'%',m.mast,m.said,m.total,weak,m.listens,Math.round(m.secs/60),m.last?new Date(m.last).toLocaleDateString('he-IL'):''].map(q).join(',');});
  return [head.map(q).join(','),...rows].join('\n'); }

/* ---------- moving data between the classroom file and the online dashboard ---------- */
function exportData(){ return JSON.stringify({app:'word-island',v:2,at:Date.now(),from:STANDALONE?'classroom':'online',students:Store.students,lists:Store.lists,media:Store.media}); }
function mergeStudent(a,b){ if(!a) return JSON.parse(JSON.stringify(b)); const o=JSON.parse(JSON.stringify(a)); if((b.updatedAt||0)>(a.updatedAt||0)){ o.name=b.name; o.avatar=b.avatar; }
  o.words=o.words||{}; for(const [k,v] of Object.entries(b.words||{})){ const x=o.words[k]||{}; for(const [f,n] of Object.entries(v||{})) if(typeof n==='number') x[f]=Math.max(x[f]||0,n); o.words[k]=x; }
  o.stages=o.stages||{}; for(const [k,v] of Object.entries(b.stages||{})){ const x=o.stages[k]; if(!x){ o.stages[k]=v; continue; }
    x.done=!!(x.done||v.done); x.stars=Math.max(x.stars||0,v.stars||0); x.plays=Math.max(x.plays||0,v.plays||0); if(v.best) x.best=x.best?Math.min(x.best,v.best):v.best;
    if(v.last&&(!x.last||(v.last.at||0)>(x.last.at||0))) x.last=v.last; if(v.first) x.first=x.first?Math.min(x.first,v.first):v.first; }
  o.days=o.days||{}; for(const [k,v] of Object.entries(b.days||{})) o.days[k]=Math.max(o.days[k]||0,v||0); o.lastActive=Math.max(o.lastActive||0,b.lastActive||0); return o; }
async function importData(text){ const d=JSON.parse(text); if(!d||d.app!=='word-island') throw new Error('bad'); let ns=0,nl=0;
  for(const [id,s] of Object.entries(d.students||{})){ if(!s||!s.name) continue; const tid=Store.students[id]?id:((Object.values(Store.students).find(x=>x.name.trim()===String(s.name).trim())||{}).id);
    const m=mergeStudent(tid?Store.students[tid]:null,s); m.id=tid||id; delete m.cloud; Store.students[m.id]=m; Store.save(m.id,true); ns++; }
  for(const [id,l] of Object.entries(d.lists||{})){ const cur=Store.lists[id]; if(cur&&(cur.updatedAt||0)>=(l.updatedAt||0)) continue;
    const media={}; for(const w of l.words||[]) if(d.media&&d.media[w.id]) media[w.id]={img:d.media[w.id].img||'',audio:d.media[w.id].audio||''};
    const meta=JSON.parse(JSON.stringify(l)); delete meta.cloud; await Store.saveList(meta,media,[]); nl++; }
  rebuildCW(); return {ns,nl}; }

/* ---------- render + events ---------- */
function render(){ const v={who:vWho,newp:vNew,map:vMap,learn:vLearn,match:vMatch,quiz:vQuiz,done:vDone,bank:vBank,cert:vCert,pin:vPin,teacher:vTeacher}[App.screen]||vWho;
  if((App.kidScreen()||['learn','match','quiz'].includes(App.screen))&&!App.s){ App.screen='who'; $('#app').innerHTML=vWho(); return; }
  if(['learn','match','quiz','done'].includes(App.screen)&&!App.g){ App.screen='map'; $('#app').innerHTML=vMap(); return; }
  $('#app').innerHTML=v(); }

const ACT={
  home:()=>{ if(App.s){Store.save(App.s.id,true);} App.sid=null; App.go('who'); },
  pick:el=>{ App.sid=el.dataset.id; Sound.sfx('tap'); App.go('map'); },
  newp:()=>{ App.np.avatar=AVATARS[Math.floor(Math.random()*AVATARS.length)]; App.go('newp'); setTimeout(()=>{const i=$('#np-name'); i&&i.focus();},50); },
  npav:el=>{ App.np.avatar=el.dataset.a; document.querySelectorAll('.avatars button').forEach(b=>b.setAttribute('aria-pressed',b===el)); Sound.sfx('tap'); },
  map:()=>{ if(App.s) Store.save(App.s.id,true); App.go('map'); },
  stage:el=>{ const k=el.dataset.k; startStage(k.startsWith('L:')?k:+k); },
  hear:el=>hear(el.dataset.w,false),
  slow:el=>hear(el.dataset.w,true),
  said:el=>{ const id=el.dataset.w,g=App.g; if(!g.heard.has(id)){ toast('קודם לחצו על 🔊 ותקשיבו'); return; } const x=ws(App.s,id); x.r++; g.said[id]=(g.said[id]||0)+1; touch();

  mic:el=>micCheck(el.dataset.w),
  skipw:el=>{ const id=el.dataset.w,g=App.g; const x=ws(App.s,id); x.sk=(x.sk||0)+1; touch(); g.ok.add(id); const c=document.querySelector(`[data-card="${id}"]`);
    if(c){ c.classList.add('heard'); c.classList.remove('yourturn','listening'); } const sp=document.querySelector(`[data-speak="${id}"]`); if(sp) sp.innerHTML='';
    setSaid(id,'⏭️ נתרגל את המילה הזו שוב בהמשך',''); updateLearn(); Store.save(App.s.id); },
  nomic:()=>{ const g=App.g; g.mode='off'; App.micHelp=false; toast('ממשיכים בלי מיקרופון: מקשיבים, אומרים בקול ולוחצים "אמרתי!"'); render(); },
  myvoice:el=>{ const u=App.g&&App.g.rec[el.dataset.w]; if(!u) return; Sound.stop(); try{ const a=new Audio(u); Sound.el=a; a.play(); }catch(e){} },
  'michelp-x':()=>{ App.micHelp=false; Speak.ok=null; render(); },
  't-export':async()=>{ const name='אי-המילים-נתונים-'+dayKey()+'.json'; const data=exportData();
    if(STANDALONE){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000); toast('הקובץ נשמר בתיקיית ההורדות'); return; }
    let dl=null; try{ dl=window.claude&&window.claude.use? await window.claude.use('downloads'):null; }catch(e){}
    if(!dl){ toast('שמירת קבצים לא זמינה בתצוגה הזו'); return; }
    try{ await dl.save({filename:name,data}); toast('הקובץ נשמר'); }catch(e){ if(!e||e.code!=='declined') toast('לא הצלחנו לשמור את הקובץ'); } },
  approve:el=>{ const id=el.dataset.w,g=App.g; if(!g.heard.has(id)){ toast('קודם הקשיבו למילה 🔊'); return; } const x=ws(App.s,id); x.r++; x.sa++; touch(); verify(id); },
  playall:async el=>{ const g=App.g; el.disabled=true; const tok=++ACT.pa; for(const w of g.words){ if(App.screen!=='learn'||tok!==ACT.pa) break; await hear(w.id,false); await sleep(700); } el.disabled=false; },
  tomatch:()=>toMatch(),
  mw:el=>mPick('w',el.dataset.w), mp:el=>mPick('p',el.dataset.w),
  qplay:()=>qPlay(false), qslow:()=>qPlay(true), qpick:el=>qPick(el),
  bank:()=>App.go('bank'), cert:()=>{ App.go('cert'); setTimeout(()=>{FX.burst(200);Sound.phrase('amazing');},300); }, amazing:()=>Sound.phrase('amazing'),
  teacher:()=>{ App.pin=''; App.pinMsg=''; App.go('pin'); }, key:el=>pinKey(el.dataset.k),
  't-exit':()=>{ App.t.demo=false; App.t.confirm=null; App.t.edit=null; App.go('who'); },
  't-tab':el=>{ App.t.tab=el.dataset.tab; App.t.detail=null; App.t.confirm=null; render(); },
  't-demo':()=>{ App.t.demo=!App.t.demo; App.t.detail=null; render(); },
  't-open':el=>{ App.t.detail=el.dataset.id; App.t.confirm=null; render(); window.scrollTo({top:0}); },
  't-back':()=>{ App.t.detail=null; App.t.tab='students'; App.t.confirm=null; render(); },
  't-sort':el=>{ const k=el.dataset.k; if(App.t.sort===k) App.t.dir*=-1; else { App.t.sort=k; App.t.dir=k==='name'?1:-1; } render(); },
  't-wsort':el=>{ App.t.wsort=el.dataset.k; render(); },
  't-ask':el=>{ App.t.confirm={type:el.dataset.type,id:el.dataset.id}; render(); },
  't-cancel':()=>{ App.t.confirm=null; render(); },
  't-do':el=>{ const id=el.dataset.id,c=App.t.confirm; if(!c) return; if(c.type==='reset'){ Store.reset(id); toast('ההתקדמות אופסה'); } else { Store.remove(id); App.t.detail=null; App.t.tab='students'; toast('התלמיד/ה נמחק/ה'); } App.t.confirm=null; render(); },
  't-wipe':()=>{ for(const id of Object.keys(Store.students)) Store.remove(id); App.t.confirm=null; toast('נתוני התלמידים נמחקו'); render(); },
  't-openall':el=>{ Store.setSettings({openAll:el.checked}); toast(el.checked?'כל השלבים פתוחים':'שלבים נפתחים לפי הסדר'); },
  't-sfx':el=>{ Store.setSettings({sfx:el.checked}); },
  't-mictest':async el=>{ const o=$('#t-mictest-out'); if(!Speak.supported()){ o.textContent='הדפדפן הזה לא תומך בזיהוי דיבור.'; return; } el.disabled=true; o.textContent='👂 מקשיב... אמרו Hello';
    const r=await Speak.listen(); el.disabled=false; if((r.alts||[]).length){ o.textContent='✅ עובד! שמעתי: "'+r.alts[0]+'"'+(Speak.match('Hello',r.alts)?' · זוהה נכון':''); }
    else o.textContent='❌ לא עבד. קוד: '+(r.err||'לא נשמע דיבור')+(r.err==='not-allowed'?' · צריך לאשר מיקרופון בסמל המנעול ליד הכתובת':r.err==='network'?' · צריך אינטרנט':r.err==='no-audio'?' · המיקרופון לא נפתח':''); },
  't-fbadult':el=>{ Store.setSettings({fallbackAdult:el.checked}); },
  't-speak':el=>{ Store.setSettings({speak:el.value}); toast(el.value==='off'?'בדיקת ההגייה כבויה':el.value==='adult'?'מבוגר יאשר את ההגייה':'זיהוי דיבור אוטומטי, עם אישור מבוגר כגיבוי'); render(); },
  't-weaklist':el=>{ const s=Store.students[el.dataset.id]; if(!s) return; const weak=wordsFor(s).filter(w=>{const v=s.words&&s.words[w.id]; return v&&(level(v)===-1||(v.ma+v.qa>=2&&(v.mo+v.qo)/(v.ma+v.qa)<.5));}).slice(0,8);
    const d=newDraft(); d.name='חיזוק: '+s.name; d.to=[s.id]; d.words=weak.map(w=>({...blankWord(),en:w.en,he:w.he,emo:w.img?'📝':w.emo,auto:false,img:w.img||'',audio:w.audio||''})); while(d.words.length<3) d.words.push(blankWord());
    App.t.edit=d; App.t.detail=null; App.t.tab='vocab'; App.t.msg=''; render(); window.scrollTo({top:0}); },
  't-csv-copy':async()=>{ const t=csv(); try{ await navigator.clipboard.writeText(t); toast('הטבלה הועתקה. הדביקו בגיליון.'); App.t.csv=null; }catch(e){ App.t.csv=t; render(); const ta=$('#t-csv'); ta&&ta.select(); toast('סמנו והעתיקו את הטקסט'); } },
  't-csv-dl':async()=>{ let dl=null; try{ dl=window.claude&&window.claude.use? await window.claude.use('downloads'):null; }catch(e){}
    if(!dl){ App.t.csv=csv(); render(); toast('הורדה לא זמינה כאן. אפשר להעתיק את הטקסט.'); return; }
    try{ await dl.save({filename:'אי-המילים-'+dayKey()+'.csv',data:'﻿'+csv()}); toast('הקובץ נשמר'); }catch(e){ if(!e||e.code!=='declined') toast('לא הצלחנו לשמור את הקובץ'); } },
  'le-new':()=>{ App.t.edit=newDraft(); App.t.msg=''; render(); setTimeout(()=>{const i=$('#le-name'); i&&i.focus();},30); },
  'le-edit':el=>{ const l=Store.lists[el.dataset.id]; if(!l) return; App.t.edit=draftFromList(l); App.t.msg=''; render(); },
  'le-cancel':()=>{ App.t.edit=null; App.t.msg=''; render(); },
  'le-remove':el=>{ Store.removeList(el.dataset.id); App.t.confirm=null; toast('הרשימה נמחקה'); render(); },
  'le-to':el=>{ const d=App.t.edit; d.to=el.value==='all'?'all':(Array.isArray(d.to)?d.to:[]); render(); },
  'le-stud':el=>{ const d=App.t.edit; if(!Array.isArray(d.to)) d.to=[]; if(el.checked){ if(!d.to.includes(el.value)) d.to.push(el.value); } else d.to=d.to.filter(x=>x!==el.value); },
  'le-addrow':()=>{ const d=App.t.edit; if(d.words.length>=8) return; d.words.push(blankWord()); render(); const w=d.words[d.words.length-1]; setTimeout(()=>{const i=document.getElementById('le-en-'+w.id); i&&i.focus();},30); },
  'le-del':el=>{ const d=App.t.edit; const [w]=d.words.splice(+el.dataset.i,1); if(w&&!d.isNew) d.removed.push(w.id); render(); },
  'le-clear':el=>{ const w=App.t.edit.words[+el.dataset.i]; w.img=''; w.audio=''; render(); },
  'le-test':el=>{ const w=App.t.edit.words[+el.dataset.i]; if(!w.en.trim()){ toast('כתבו קודם את המילה באנגלית'); return; } Sound.stop();
    if(w.audio) Sound.play('t_'+w.id+'_'+w.audio.length,w.en,w.audio); else { Sound.speak(w.en,()=>{}); toast('בלי הקלטה: זה קול המחשב. אם לא שמעתם כלום, העלו הקלטה 🎙️'); } },
  'le-bulk':()=>{ const d=App.t.edit; const ta=$('#le-bulk'); const lines=(ta.value||'').split(/\n+/).map(l=>l.trim()).filter(Boolean); let added=0;
    d.words=d.words.filter(w=>w.en.trim()||w.he.trim()||w.img||w.audio);
    for(const line of lines){ if(d.words.length>=8) break; const parts=line.split(/\s*(?:\t|[-–—:,=|])\s*/).filter(Boolean); if(parts.length<2) continue;
      let en=parts.find(p=>/[a-zA-Z]/.test(p)), he=parts.find(p=>/[֐-׿]/.test(p)); if(!en||!he) continue; d.words.push({...blankWord(),en,he,emo:guessEmoji(en)}); added++; }
    while(d.words.length<3) d.words.push(blankWord()); render(); toast(added?`נוספו ${added} מילים`:'לא זיהיתי שורות. כתבו: apple - תפוח'); },
  'le-save':()=>saveDraft()
};
ACT.pa=0;
const FORM={
  newp:f=>{ const n=$('#np-name').value.trim(); if(!n) return; const id=Store.add(n,App.np.avatar); App.sid=id; App.go('map'); Sound.phrase('hello'); FX.burst(60); },

};
const app=$('#app');
document.addEventListener('pointerdown',()=>{ Sound.unlock(); lastInput=Date.now(); },{capture:true});
document.addEventListener('keydown',e=>{ Sound.unlock(); lastInput=Date.now(); if(App.screen==='pin'){ if(/^[0-9]$/.test(e.key)) pinKey(e.key); else if(e.key==='Backspace') pinKey('back'); } },{capture:true});
app.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el||el.tagName==='INPUT'&&!['checkbox','radio'].includes(el.type)) return; const f=ACT[el.dataset.act]; if(f) f(el,e); });
app.addEventListener('submit',e=>{ e.preventDefault(); const f=FORM[e.target.dataset.form]; f&&f(e.target); });
app.addEventListener('input',e=>{ const el=e.target; const d=App.t.edit; if(!d||!el.dataset.f) return;
  if(el.dataset.f==='name'){ d.name=el.value; return; } const i=+el.dataset.i, w=d.words[i]; if(!w) return;
  if(el.dataset.f==='en'){ w.en=el.value; if(w.auto||!w.emo){ const g=guessEmoji(w.en); w.emo=g; w.auto=true; const ei=document.getElementById('le-emo-'+w.id); if(ei) ei.value=g; updLpic(i); } }
  else if(el.dataset.f==='he') w.he=el.value;
  else if(el.dataset.f==='emo'){ w.emo=el.value.trim(); w.auto=!w.emo; updLpic(i); } });
app.addEventListener('change',async e=>{ const el=e.target;
  if(el.dataset.up==='import'){ const f=el.files&&el.files[0]; if(!f) return; try{ const r=await importData(await f.text()); toast(`נטען: ${r.ns} תלמידים, ${r.nl} רשימות`); }catch(err){ toast('הקובץ לא מתאים. בחרו קובץ נתונים של אי המילים (json).'); } el.value=''; render(); return; }
  if(!el.dataset.up||!App.t.edit) return; const f=el.files&&el.files[0]; if(!f) return; const w=App.t.edit.words[+el.dataset.i]; if(!w) return;
  try{ if(el.dataset.up==='img'){ w.img=await fileToImg(f); toast('התמונה נוספה'); }
    else { if(f.size>15*1024*1024){ toast('הקובץ גדול מדי. הקליטו רק את המילה.'); return; } w.audio=await fileToClip(f); toast('ההקלטה נוספה. לחצו 🔊 לבדיקה'); }
  }catch(err){ toast(el.dataset.up==='img'?'לא הצלחנו לקרוא את התמונה':'לא הצלחנו לקרוא את ההקלטה. נסו קובץ mp3, m4a או wav'); }
  render(); });

/* ---------- boot ---------- */
function start(data){ Store.loadLocal(); if(data&&data.sid&&Store.students[data.sid]){ App.sid=data.sid; App.screen=data.screen==='teacher'?'pin':'map'; } render(); Store.connect(); }
try{ window.speechSynthesis&&speechSynthesis.getVoices(); }catch(e){}
window.claude?.hot?.snapshot?.(()=>({sid:App.sid,screen:App.screen}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
